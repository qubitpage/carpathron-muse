<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair with Muse Carpathron</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0f12;color:#e8eaed;font:18px/1.5 "Segoe UI",system-ui,sans-serif}
  .box{width:min(440px,calc(100vw - 32px));text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  input{width:100%;box-sizing:border-box;font-size:40px;letter-spacing:.4em;text-align:center;padding:14px;border-radius:14px;border:1px solid #323844;background:#171a1f;color:#fff;margin:18px 0 12px}
  button{width:100%;padding:16px;font-size:20px;border:0;border-radius:14px;background:#4f8cff;color:#fff;font-weight:700}
  #msg{min-height:1.5em;margin-top:12px;color:#ff8f9a}
  .muted{color:#959cab;font-size:15px}
</style></head>
<body><div class="box">
  <img src="/icon.png" alt="">
  <h2>Pair with Muse Carpathron</h2>
  <p class="muted">On the PC: Muse Carpathron → Robot (or Settings) shows a 6-digit PIN.</p>
  <form id="f"><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" autofocus><button>Pair</button></form>
  <div id="msg"></div>
</div>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const r = await fetch('/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: document.getElementById('pin').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    location.href = '/';
  } catch (err) { msg.textContent = err.message; }
};
</script></body></html>
